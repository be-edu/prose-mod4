name: build-and-push-prose-mod
on: [push]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code from git repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Show go version
        run: go version

      - name: Print working directory
        run: pwd

      - name: Build
        run: go build ./prose

      - name: Unit test
        run: go test ./prose -v -coverprofile=coverage.xml -covermode=atomic

      - name: Add unit test coverage to summary
        run: |
          {
            echo "## unit test coverage summary"
            echo
            echo '```text'
            go tool cover -func=coverage.xml
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"